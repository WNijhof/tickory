<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16191c" media="(prefers-color-scheme: dark)">
  <title>{{page_title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
{{alternates}}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tickory">
  <meta property="og:title" content="{{page_title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{site_url}}assets/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{root}}assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="{{root}}assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png">
  <link rel="stylesheet" href="{{root}}assets/site.css">
  <script type="module" src="{{root}}assets/site.js"></script>
</head>
<body class="{{body_class}}" data-root="{{root}}" data-lang="{{lang}}" data-page="{{page_path}}" data-copy="{{t.copy}}" data-copied="{{t.copied}}">
  <a class="skip" href="#inhoud">{{t.skip}}</a>
  <header class="site-header">
    <div class="wrap site-header-inner">
      <a class="brand" href="{{home_url}}" aria-label="Tickory, {{t.home}}">
        <img src="{{root}}assets/logo.svg" alt="" width="32" height="32">
        <span>Tickory</span>
      </a>
      <nav class="site-nav" aria-label="{{t.nav_label}}">
        <a href="{{guide_url}}"{{guide_current}}>{{t.guide}}</a>
        <a href="{{root}}demo/?lang={{lang}}">{{t.demo}}</a>
        <a href="{{repo}}">{{t.github}}</a>
        <a class="lang-switch" href="{{alt_url}}" hreflang="{{alt_lang}}" lang="{{alt_lang}}" title="{{t.switch_label}}">{{t.switch_to}}</a>
      </nav>
    </div>
  </header>
{{body}}
  <footer class="site-footer">
    <div class="wrap site-footer-inner">
      <p>{{t.footer_tagline}} <a href="{{repo}}">{{t.footer_source}}</a> · <a href="{{root}}LICENSE.txt">{{t.footer_license}}</a> · <a href="{{root}}THIRD_PARTY_NOTICES.txt">{{t.footer_third_party}}</a></p>
      <p>{{t.footer_privacy}} {{t.footer_version}} {{version}}.</p>
    </div>
  </footer>
</body>
</html>
