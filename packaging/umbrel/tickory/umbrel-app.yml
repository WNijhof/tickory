manifestVersion: 1
id: tickory
category: files
name: Tickory
version: "0.12.6"
tagline: Your own to-do list and notes, a free Todoist alternative
description: >-
  Tickory is a to-do list and notes app you host yourself: for you, your family or a small team.


  Projects, sections, subtasks, labels, priorities, deadlines and recurring tasks. Quick add in plain language
  ("Call the dentist tomorrow at 9am #Home p1 with a reminder 30 minutes before"), Today, Upcoming, list, board and
  calendar views, search and filters. Shared projects with assigning, comments, attachments and notifications.
  Notes with checklists, pictures and audio. Works offline as an installable web app, with an Android app
  (widgets), a Windows desktop app and a browser extension.


  Sign in with the username "umbrel" and the password shown here; you create the other accounts in the app.
releaseNotes: >-
  On Android, tapping a task in a widget opens a small window to edit it right there (title, description, date, priority,
  labels, project), as with Todoist. The small Add task window highlights the recognised date, project and labels as you type.
