# Starten:   docker compose up -d
# Zet eerst de gegevens voor het eerste account in het bestand .env (zie .env.example).
#
# Kies één van de twee manieren om aan de image te komen:
#   1. Uit het GitHub-register (snel, geen bouwtijd op je server): de regel "image:" hieronder.
#   2. Zelf bouwen uit deze map: haal de regel "image:" weg en zet "build: ." terug.
#
# Accounts beheren kan in de app (Instellingen > Account > Gebruikersbeheer) of vanaf de server:
#   docker compose exec tickory node server/main.ts user list
#   docker compose exec -e TODO_PASSWORD='een-goed-wachtwoord' tickory node server/main.ts user add anna --name "Anna"
services:
  tickory:
    image: ghcr.io/wnijhof/tickory:latest
    # build: .
    container_name: tickory
    restart: unless-stopped
    init: true
    environment:
      # Alleen bij de allereerste start gebruikt: hiermee wordt het eerste account (de beheerder) aangemaakt.
      # Bestaat er al een account, dan doen deze niets meer. Haal het wachtwoord dan uit .env en maak de container opnieuw aan
      # (docker compose up -d --force-recreate); anders blijft het in de configuratie van de container staan (docker inspect).
      # Liever helemaal niet in de omgeving? Zet TODO_ADMIN_PASSWORD_FILE op het pad van een bestand met het wachtwoord, bijvoorbeeld
      # een Docker-secret onder /run/secrets/, en laat TODO_ADMIN_PASSWORD leeg.
      TODO_ADMIN_USER: ${TODO_ADMIN_USER:-}
      TODO_ADMIN_PASSWORD: ${TODO_ADMIN_PASSWORD:-}
      TODO_ADMIN_PASSWORD_FILE: ${TODO_ADMIN_PASSWORD_FILE:-}
      TODO_ADMIN_NAME: ${TODO_ADMIN_NAME:-}
      # Zet op 1 als er een eigen reverse proxy voor staat; dan telt het adres van de bezoeker bij het beperken van inlogpogingen.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Meldingen in de browser: een contactadres voor de pushdienst ("mailto:jij@voorbeeld.nl" of een https-adres),
      # en de tijdzone voor gebruikers die er zelf nog geen hebben ingesteld.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Amsterdam}
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
      # Bijlagen bij taken: het grootste bestand en de opslagruimte per gebruiker, in megabytes. De bestanden staan in het volume
      # (/data/attachments) naast de database. Staat er een reverse proxy voor, zet dan ook daar de grens ruim genoeg
      # (nginx: client_max_body_size, standaard maar 1 MB).
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      ATTACHMENT_QUOTA_MB: ${ATTACHMENT_QUOTA_MB:-1024}
      # Aangemelde apparaten: afgemeld na zoveel dagen zonder gebruik, en hoe dan ook na zoveel dagen opnieuw inloggen (0 = uit).
      SESSION_IDLE_DAYS: ${SESSION_IDLE_DAYS:-90}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-365}
      # Het sleutelbestand voor tweestapsverificatie; leeg = /data/secret.key (maakt de server zelf). Het zit niet in een back-up:
      # bewaar er zelf een kopie van, apart van je back-ups.
      SECRET_KEY_FILE: ${SECRET_KEY_FILE:-}
    ports:
      # Alleen bereikbaar vanaf de server zelf: zet er een reverse proxy met HTTPS voor (zie README).
      # Wil je het zonder proxy op je thuisnetwerk gebruiken, maak er dan "8787:8787" van.
      - "127.0.0.1:8787:8787"
    volumes:
      - tickory-data:/data
    # Extra beveiliging: de container kan alleen in /data schrijven en heeft geen bijzondere rechten.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  tickory-data:
